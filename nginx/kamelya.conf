# =============================================================================
# NGINX CONFIG — KAMELYA PRODUCTION
# =============================================================================
# Hedef: /etc/nginx/sites-available/kamelya.conf
# ln -s /etc/nginx/sites-available/kamelya.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# =============================================================================

# Upstream PHP-FPM (socket tercih edilir, performans için)
upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
    # server 127.0.0.1:9000;  # TCP fallback
}

# HTTP -> HTTPS yönlendirme (Let's Encrypt ACME challenge hariç)
server {
    listen 80;
    listen [::]:80;
    server_name kamelya.com www.kamelya.com;

    # ACME challenge (certbot) için izin ver
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Geri kalanı HTTPS'e yönlendir
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kamelya.com www.kamelya.com;

    # ---- SSL (Let's Encrypt / certbot) ----
    # TODO: Sunucu alındığında certbot ile üretilecek
    # certbot --nginx -d kamelya.com -d www.kamelya.com
    ssl_certificate /etc/letsencrypt/live/kamelya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kamelya.com/privkey.pem;

    # SSL Güvenlik
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- HSTS (1 yıl, preload) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---- Güvenlik Başlıkları ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Powered-By "" always;

    # ---- CSP (Production - raporlu, sonra enforce) ----
    # TODO: Rapor modunda başla (report-only), sonra enforce et
    add_header Content-Security-Policy-Report-Only "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://www.googletagmanager.com https://www.google-analytics.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com;
        frame-src 'self' https://www.google.com;
        form-action 'self';
        base-uri 'self';
        object-src 'none';
        report-uri /csp-report;
    " always;

    # ---- Root & Index ----
    # TODO: Deployer.php current symlink hedefi
    root /var/www/kamelya/current/public;
    index index.php;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # ---- Static Assets (Cache) ----
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- Favicon / Robots / Sitemap ----
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }

    # ---- PHP Handler ----
    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # ---- Front Controller (public/index.php) ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Admin Panel IP Kısıtlaması (Opsiyonel - İp allowlist) ----
    # location /admin/ {
    #     allow 1.2.3.4;  # TODO: Sabit IP
    #     deny all;
    #     try_files $uri $uri/ /index.php?$query_string;
    # }

    # ---- Uploads / Storage (Public-dışı erişim engeli) ----
    location ~ ^/storage/ {
        internal;  # Sadece X-Accel-Redirect ile erişim
    }

    # ---- Loglar ----
    access_log /var/log/nginx/kamelya_access.log;
    error_log /var/log/nginx/kamelya_error.log warn;

    # ---- Rate Limiting (API için ekstra) ----
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # location /api/v1/calculate { limit_req zone=api burst=5 nodelay; ... }
}

# ---- www -> non-www (veya tersi, SEO tercihi) ----
# Bu config non-www ana, www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kamelya.com;

    ssl_certificate /etc/letsencrypt/live/kamelya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kamelya.com/privkey.pem;

    return 301 https://kamelya.com$request_uri;
}